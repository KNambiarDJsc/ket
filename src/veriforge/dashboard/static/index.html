<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriForge Dashboard</title>
<style>
  :root {
    --bg: #12151a; --bg-raised: #1b2027; --bg-sunken: #0d0f13;
    --text: #e8eaea; --text-dim: #a3aab1; --line: #2a3038;
    --accent: #5fb6d4; --pass: #57bf5d; --fail: #e2745a; --uncertain: #dbb050;
    font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--text-dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; padding: 20px 24px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  section { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--text-dim); font-weight: 500; }
  tr.job-row { cursor: pointer; }
  tr.job-row:hover { background: var(--bg-sunken); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .pill.PASS { background: rgba(87,191,93,0.15); color: var(--pass); }
  .pill.FAIL { background: rgba(226,116,90,0.15); color: var(--fail); }
  .pill.UNCERTAIN { background: rgba(219,176,80,0.15); color: var(--uncertain); }
  .pill.none { background: rgba(163,170,177,0.15); color: var(--text-dim); }
  input, textarea, button {
    font-family: inherit; font-size: 13px; background: var(--bg-sunken); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  input, textarea { width: 100%; margin-bottom: 8px; }
  button { cursor: pointer; background: var(--accent); color: #08131a; border: none; font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  form { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
  #detail pre { white-space: pre-wrap; word-break: break-word; background: var(--bg-sunken); padding: 10px; border-radius: 6px; font-size: 12px; }
  #detail .finding { border-left: 3px solid var(--fail); padding: 8px 10px; margin-bottom: 8px; background: var(--bg-sunken); border-radius: 0 6px 6px 0; }
  #ask-answer { white-space: pre-wrap; background: var(--bg-sunken); padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 12.5px; min-height: 1em; }
  .empty { color: var(--text-dim); font-style: italic; }
  .status-msg { font-size: 12px; margin-top: 6px; }
  .status-msg.error { color: var(--fail); }
  .status-msg.ok { color: var(--pass); }
  .status-msg.warn { color: var(--uncertain); }
  #verify-warning { display: none; margin-top: 8px; padding: 8px 10px; border-radius: 6px; font-size: 12px;
    background: rgba(219,176,80,0.12); border: 1px solid rgba(219,176,80,0.4); color: var(--uncertain); }
</style>
</head>
<body>
<header>
  <h1>VeriForge</h1>
  <span>Dashboard — Phase 20</span>
</header>

<main>
  <div>
    <section>
      <h2>Job History</h2>
      <table id="jobs-table">
        <thead><tr><th>Job</th><th>Project</th><th>State</th><th>Verdict</th><th>Findings</th></tr></thead>
        <tbody id="jobs-body"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </section>

    <section style="margin-top: 20px;">
      <h2>Run a new verification</h2>
      <form id="verify-form">
        <input name="repo" placeholder="--repo (local path or GitHub URL)">
        <input name="subdir" placeholder="--subdir (optional)">
        <input name="requirements" placeholder="--requirements (markdown file)">
        <input name="url" placeholder="--url (running app base URL)">
        <input name="db_path" placeholder="--db-path (optional)">
        <button type="submit">Run verify</button>
      </form>
      <div id="verify-status" class="status-msg"></div>
      <div id="verify-warning"></div>
    </section>
  </div>

  <div>
    <section>
      <h2>Ask about job history</h2>
      <form id="ask-form">
        <input name="question" placeholder="e.g. which jobs found security findings?">
        <button type="submit">Ask</button>
      </form>
      <div id="ask-answer" class="empty">Ask a question about the job history above.</div>
    </section>

    <section id="detail" style="margin-top: 20px;">
      <h2>Job detail</h2>
      <div id="detail-body" class="empty">Select a job to see its requirements and findings.</div>
    </section>
  </div>
</main>

<script>
async function fetchJSON(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(body.detail || res.statusText);
  }
  return res.json();
}

function pill(verdict) {
  const v = verdict || "none";
  return `<span class="pill ${v}">${v}</span>`;
}

async function loadJobs() {
  const jobs = await fetchJSON("/api/jobs");
  const tbody = document.getElementById("jobs-body");
  if (jobs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No jobs run yet against this workdir.</td></tr>';
    return;
  }
  tbody.innerHTML = jobs.map(j => `
    <tr class="job-row" data-job-id="${j.id}">
      <td>${j.id}</td>
      <td>${j.project_name}</td>
      <td>${j.state}</td>
      <td>${pill(j.verdict)}</td>
      <td>${j.finding_count}</td>
    </tr>
  `).join("");
  tbody.querySelectorAll(".job-row").forEach(row => {
    row.addEventListener("click", () => loadJobDetail(row.dataset.jobId));
  });
}

async function loadJobDetail(jobId) {
  const detail = await fetchJSON(`/api/jobs/${jobId}`);
  const el = document.getElementById("detail-body");
  const findingsHtml = detail.findings.length
    ? detail.findings.map(f => `
        <div class="finding">
          <strong>${f.category}</strong> (confidence ${f.confidence.toFixed(2)})${f.reproduced ? " — reproduced" : ""}<br>
          ${f.summary}
        </div>
      `).join("")
    : '<p class="empty">No findings for this job.</p>';
  const reqsHtml = detail.requirements.map(r => `<li>[${r.kind}] ${r.source_text}</li>`).join("");
  el.innerHTML = `
    <p><strong>State:</strong> ${detail.job.state} &nbsp; <strong>Repo:</strong> ${detail.job.repo_path || "—"}</p>
    <h3 style="font-size:12px;color:var(--text-dim);margin:14px 0 6px;">Requirements (${detail.requirements.length})</h3>
    <ul>${reqsHtml || '<li class="empty">none parsed</li>'}</ul>
    <h3 style="font-size:12px;color:var(--text-dim);margin:14px 0 6px;">Findings</h3>
    ${findingsHtml}
  `;
}

document.getElementById("verify-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const payload = Object.fromEntries([...form.entries()].filter(([, v]) => v));
  const statusEl = document.getElementById("verify-status");
  const warnEl = document.getElementById("verify-warning");
  statusEl.textContent = "Running… (this blocks until the job finishes — no progress feedback yet)";
  statusEl.className = "status-msg";
  warnEl.style.display = "none";
  try {
    const result = await fetchJSON("/api/verify", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    const hasWarnings = result.warnings && result.warnings.length > 0;
    statusEl.textContent = `Job ${result.job_id} → verdict: ${result.verdict || "none"} (${result.finding_count} finding(s))`;
    statusEl.className = hasWarnings ? "status-msg warn" : "status-msg ok";
    if (hasWarnings) {
      warnEl.innerHTML = result.warnings.map(w => `⚠ ${w}`).join("<br><br>");
      warnEl.style.display = "block";
    }
    loadJobs();
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    statusEl.className = "status-msg error";
  }
});

document.getElementById("ask-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = new FormData(e.target).get("question");
  const answerEl = document.getElementById("ask-answer");
  answerEl.textContent = "Thinking…";
  answerEl.className = "";
  try {
    const result = await fetchJSON("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }),
    });
    answerEl.textContent = result.answer;
  } catch (err) {
    answerEl.textContent = "Error: " + err.message;
  }
});

loadJobs();
</script>
</body>
</html>
