[project]
name = "veriforge"
version = "0.1.0"
description = "Autonomous Software Verification & Testing OS"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "playwright>=1.45",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
veriforge = "veriforge.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veriforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
